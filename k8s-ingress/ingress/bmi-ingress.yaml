apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bmi-ingress
  namespace: bmi-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    # No host restriction — matches any Host header (IP or LB DNS name access)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bmi-frontend-svc
                port:
                  number: 80
