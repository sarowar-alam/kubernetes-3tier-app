apiVersion: v1
kind: Service
metadata:
  name: bmi-frontend-svc
  namespace: bmi-app
spec:
  # ClusterIP: external access is via the ingress-nginx controller + Ingress resource (see ../ingress/)
  type: ClusterIP
  selector:
    app: bmi-frontend
  ports:
    - port:       80
      targetPort: 80
      protocol:   TCP
